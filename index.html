<title>비장이 된 아내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Song+Myung&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1b1a17; --ink2:#3a2f22; --paper:#f1ead8; --paper2:#e5dac0; --line:#b9a987;
  --text:#2a241c; --muted:#6b5f4c; --seal:#b3362b; --indigo:#2b4a6f; --gold:#c9a24f;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.quest{pointer-events:auto;background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:7px 12px;max-width:min(520px,62vw);font-family:var(--ui);font-size:13px;line-height:1.45}
.quest .ch{font-family:var(--display);font-size:16px;color:var(--seal);display:block}
.quest .obj::before{content:"▸ ";color:var(--indigo)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.hb{background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:6px 10px;font-family:var(--ui);font-size:13px;white-space:nowrap}
.hb:hover{background:var(--paper)}
.hb .n{color:var(--seal);font-variant-numeric:tabular-nums;margin-left:3px}
.money{font-family:var(--ui);font-size:13px;background:rgba(241,234,216,.94);border:2px solid var(--ink2);padding:6px 10px;color:#7a5a12;font-variant-numeric:tabular-nums}

/* 대화 */
.dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));background:var(--paper);border:3px solid var(--ink2);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3px var(--line) inset,0 5px 0 rgba(0,0,0,.4);padding:16px 20px 14px;z-index:20;cursor:pointer}
.dlg .nm{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:26px}
.dlg .nm b{font-family:var(--display);font-weight:400;font-size:20px}
.dlg .nm .think{font-family:var(--ui);font-size:12px;color:var(--muted)}
.dlg .orig{margin-left:auto;display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:15px;transform:rotate(-6deg);flex:none}
.dlg .tx{font-size:17.5px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.dlg .tx.narr{color:#3d3428}
.dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted);font-family:var(--ui);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chs{display:grid;gap:6px;margin-top:10px}
.chs button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 12px;font-size:16px;line-height:1.5}
.chs button.sel,.chs button:hover{border-color:var(--indigo);background:#e9e4d3}
.chs button .k{font-family:var(--ui);font-size:12px;color:var(--muted);margin-right:8px}

.dlg.hasp .nm{margin-left:150px}
.dlg .port{position:absolute;left:14px;bottom:calc(100% - 44px);width:136px;height:136px;object-fit:cover;border:3px solid var(--ink2);background:var(--paper2);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cimg{display:block;width:calc(100% + 52px);max-width:none;margin:-24px -26px 16px;aspect-ratio:16/9;object-fit:cover;border-bottom:3px solid var(--ink2)}
@media (max-width:560px){.dlg .port{width:84px;height:84px;left:10px;bottom:calc(100% - 26px)}.dlg.hasp .nm{margin-left:92px}.cimg{width:calc(100% + 36px);margin:-18px -18px 12px}}
.dlg.story{background:#efe6d0}
.dlg.story .tx{color:#4a3d2c;font-style:normal}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;text-align:left}
.route{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;align-items:start;background:rgba(241,234,216,.95);border:3px solid var(--ink2);padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);color:var(--text)}
.route:hover,.route:focus-visible{border-color:var(--seal);transform:translateY(-2px)}
.route img{grid-row:span 2;width:84px;height:84px;object-fit:cover;border:2px solid var(--ink2)}
.route b{font-family:var(--display);font-weight:400;font-size:22px}
.route span{font-family:var(--ui);font-size:13px;line-height:1.6;color:var(--muted)}
.bt .pc img{width:96px;height:96px;object-fit:cover;border:2px solid var(--ink2);display:block;background:#d9cfb4}
.gl{margin-top:8px;padding:8px 10px;background:#e9e2cf;border-left:3px solid var(--indigo);font-family:var(--ui);font-size:14px;line-height:1.7;color:#3a3226;white-space:normal}
.gl b{font-family:var(--display);font-weight:400;color:var(--indigo);margin-right:8px;font-size:14px}
.dlg .gl{max-height:7.5em;overflow:auto}
.rec.tipr{border-left-color:var(--indigo);font-family:var(--ui);font-size:14px}
.hb.ping{animation:ping .8s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,74,111,.8)}100%{box-shadow:0 0 0 12px rgba(43,74,111,0)}}
.mg .seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.mg .arr{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper2);font-size:22px;font-family:var(--ui)}
.mg .arr.ok{background:#dfe6ef;border-color:var(--indigo);color:var(--indigo)}
.mg .arr.cur{border-color:var(--seal);background:#fff3d6;transform:scale(1.12)}
.mg .cloth{position:relative;height:56px;background:repeating-linear-gradient(45deg,#f5ecd8 0 8px,#efe3c8 8px 16px);border:2px solid var(--ink2);margin-top:10px}
.mg .seam{position:absolute;left:4%;right:4%;top:50%;border-top:2px dashed #b9a987}
.mg .thread{position:absolute;left:4%;top:calc(50% - 2px);height:4px;background:repeating-linear-gradient(90deg,var(--seal) 0 10px,transparent 10px 16px);max-width:92%;transition:width .15s}
.mg .pad4{display:grid;grid-template-columns:repeat(4,56px);gap:8px;justify-content:center;margin-top:10px}
.mg .pad4 button,.mg .pad2 button{height:52px;font-size:22px;font-family:var(--ui);background:var(--paper2);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mg .pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mg .pad2 button{font-size:16px}
.mg .gauge{height:14px;border:2px solid var(--ink2);background:var(--paper2);margin-top:10px}
.mg .gauge i{display:block;height:100%;width:0;background:var(--indigo);transition:width .1s}
.mg .wellbox{position:relative;height:150px;margin:10px auto 0;width:140px;background:linear-gradient(#8f8a7e,#6f6a60);border:3px solid var(--ink2);border-radius:6px}
.mg .rope{position:absolute;left:50%;top:0;width:2px;background:#cbb178;height:84%}
.mg .bucket{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;font-size:30px}
.mg .pot{position:relative;width:150px;height:150px;margin:10px auto 0;border-radius:50%;background:radial-gradient(circle,#f4efe4 0 45%,#2b2622 46% 60%,#1d1813 61%);border:3px solid var(--ink2)}
.mg .ladle{position:absolute;left:50%;top:14%;width:6px;height:36%;margin-left:-3px;background:#8e6a44;transform-origin:50% 100%;transition:transform .12s}
.mg .next{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .words{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;margin:14px 0;font-size:22px;font-family:var(--display)}
.mg .gap{min-width:26px;height:40px;border:0;background:transparent;color:#b9a987;font-size:20px;border-radius:6px}
.mg .gap:hover{background:#efe3c8}
.mg .gap.on{color:var(--seal);font-weight:700;background:#f7e2dc}
.mg .dishes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mg .dish{font-family:var(--ui);font-size:14px;background:var(--paper2);border:2px solid var(--line);padding:6px 10px}
.mg .dish.sel{border-color:var(--seal);background:#fff3d6}
.mg .table{display:grid;grid-template-columns:1fr 1fr 1fr 70px;grid-template-rows:64px 64px;gap:8px;padding:12px;background:#8e5a34;border:3px solid #5a3b22;border-radius:8px}
.mg .slot{background:#a8744a;border:2px dashed #e8d2a8;color:#fff4de;font-family:var(--ui);font-size:13px;display:grid;place-items:center;line-height:1.2}
.mg .slot b{font-weight:500;display:block}
.mg .slot i{font-style:normal;opacity:.75}
.mg .s-b1{grid-column:1;grid-row:1}.mg .s-b2{grid-column:2;grid-row:1}.mg .s-b3{grid-column:3;grid-row:1}.mg .s-f1{grid-column:1;grid-row:2}.mg .s-f2{grid-column:2/4;grid-row:2}.mg .s-s{grid-column:4;grid-row:1/3}
.mg .mgmsg{min-height:1.6em;margin-top:8px}
.lnk{background:none;border:0;color:#e3c27a;text-decoration:underline;font-family:var(--ui);font-size:12px;margin-top:6px;cursor:pointer}
.tq{display:block;font-style:normal;font-size:12.5px;opacity:.8;margin-bottom:3px;border-left:2px solid currentColor;padding-left:7px}
.mg .cloth2{position:relative;height:96px;margin-top:10px;background:var(--cl);border:2px solid var(--ink2);border-radius:4px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.mg .cloth2 .weave{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px)}
.mg .cloth2 .seam2{position:absolute;left:5%;right:5%;top:58%;border-top:2px dashed rgba(60,40,20,.35)}
.mg .cloth2 .st{position:absolute;top:calc(58% - 3px);height:5px;background:#b23a2a;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.35);animation:stIn .18s ease-out}
.mg .cloth2 .st.out{animation:stOut .25s forwards}
@keyframes stIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@keyframes stOut{to{opacity:0;transform:translateY(10px) rotate(20deg)}}
.mg .cloth2 .thr{position:absolute;top:calc(58% - 1px);height:3px;background:#b23a2a;opacity:.8;transition:left .15s,width .15s}
.mg .cloth2 .needle{position:absolute;top:calc(58% - 62px);width:9px;height:76px;margin-left:-4px;filter:drop-shadow(0 0 1px #222) drop-shadow(2px 3px 0 rgba(0,0,0,.25));transform:rotate(-28deg);transform-origin:50% 90%;transition:left .15s}
.mg .cloth2 .needle::before{content:"";position:absolute;left:1px;top:0;width:7px;height:100%;background:linear-gradient(90deg,#8d949c,#eef1f4 45%,#7d848c);border-radius:2px 2px 50% 50%/2px 2px 100% 100%}
.mg .cloth2 .needle i{position:absolute;left:3px;top:6px;width:3px;height:10px;background:var(--cl);border-radius:1px}
.mg .cloth2 .needle.dip{animation:dip .24s ease-in-out}
@keyframes dip{0%{transform:rotate(-28deg) translateY(0)}45%{transform:rotate(-8deg) translateY(22px)}100%{transform:rotate(-28deg) translateY(0)}}
.mg .cloth2 .needle.done{animation:lift .6s forwards}
@keyframes lift{to{transform:rotate(-60deg) translate(-10px,-30px);opacity:0}}
.mg .cloth2.tangle{animation:tangle .3s}
@keyframes tangle{25%{transform:translateX(-5px) rotate(-.6deg)}75%{transform:translateX(5px) rotate(.6deg)}}
.mg .cloth2.finish{box-shadow:0 0 0 4px #e3c27a,inset 0 -6px 0 rgba(0,0,0,.08);transition:box-shadow .3s}
.mg .cloth2 .spark{position:absolute;top:calc(58% - 14px);width:28px;height:28px;margin-left:-14px;border-radius:50%;pointer-events:none;opacity:0}
.mg .cloth2 .spark.on{animation:spark .35s ease-out}
@keyframes spark{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,236,170,.9)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,236,170,0)}}
.mg .sewbar{display:flex;justify-content:space-between;font-family:var(--ui);font-size:13px;margin-top:6px;min-height:1.4em}
.mg .sewbar .combo{color:var(--seal);font-weight:700}
.mg .sugi{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:14px 16px 18px;margin-top:8px;font-family:var(--display);font-size:17px;line-height:1.9}
.mg .sugi .orig{position:absolute;right:8px;top:6px}
.mg .sugi p{margin:0}
.mg .sugsign{display:inline-block;margin-top:8px;color:var(--seal);font-family:var(--ui);font-size:14px;animation:stIn .3s}
.mg .sugsign i{font-style:normal;font-family:var(--display);font-size:22px;border:2px solid var(--seal);padding:0 6px;margin-left:6px}
.mg .picks{display:grid;gap:6px;margin-top:8px}
.mg .picks.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg .picks button{font-family:var(--ui);font-size:14px;text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.mg .picks button.on{border-color:var(--indigo);background:#dfe6ef}
.mg .picks button:hover{border-color:var(--indigo)}
.mg .resp{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--seal)}
.mg .brushwrap{display:flex;justify-content:center;margin-top:10px}
.mg .brush{display:grid;justify-items:center;gap:4px;background:var(--paper2);border:2px solid var(--ink2);padding:8px 18px;cursor:pointer;touch-action:none;user-select:none;font-family:var(--ui);font-size:13px}
.mg .brush svg{width:160px;height:70px}
.mg .brush .stroke{fill:none;stroke:#1d1813;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mg .route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:12px 0}
.mg .route .stop{display:flex;align-items:center;font-family:var(--ui);font-size:13px}
.mg .route .stop i{display:inline-block;width:18px;height:3px;background:var(--line)}
.mg .route .stop:first-child i{display:none}
.mg .route .stop b{font-weight:500;border:2px solid var(--line);background:var(--paper2);padding:3px 7px;min-width:34px;text-align:center}
.mg .route .stop.on i{background:var(--indigo)}
.mg .route .stop.on b{border-color:var(--indigo);background:#dfe6ef;color:var(--indigo)}
.mg .route .stop.cur b{border-color:var(--seal);border-style:dashed}
/* 알림 */
.tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));width:min(560px,calc(100% - 24px));background:#2b4a6f;color:#f1ead8;border:2px solid #16283d;box-shadow:0 4px 0 rgba(0,0,0,.35);padding:10px 14px;font-family:var(--ui);font-size:14px;line-height:1.6;z-index:30;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tip i{font-style:normal;font-family:var(--display);font-size:14px;border:1.5px solid #f1ead8;padding:0 5px;flex:none;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:40%;background:var(--paper);border:3px solid var(--ink2);padding:14px 20px;z-index:31;font-family:var(--ui);font-size:15px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.4);animation:pop .3s}
.toast b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--seal);margin-bottom:4px}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}

/* 전면 카드·패널 */
.veil{position:fixed;inset:0;background:rgba(15,13,10,.72);z-index:40;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.sheet{background:var(--paper);border:3px solid var(--ink2);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3px var(--line) inset,0 8px 0 rgba(0,0,0,.4);width:min(640px,100%);padding:24px 26px;max-height:100%;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,36px);margin:0 0 6px;line-height:1.2}
.sheet h3{font-family:var(--display);font-weight:400;font-size:21px;margin:18px 0 8px}
.sheet .eb{font-family:var(--ui);font-size:12px;letter-spacing:.16em;color:var(--seal)}
.sheet p{font-size:16.5px;line-height:1.85;margin:8px 0;white-space:pre-wrap}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.btn{font-family:var(--ui);font-size:15px;background:var(--paper2);border:2px solid var(--ink2);padding:9px 16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:hover{background:#ece3cc}
.btn.pri{background:var(--indigo);color:var(--paper);border-color:#16283d}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-family:var(--ui);font-size:13px;color:var(--muted);line-height:1.6}
.list{display:grid;gap:8px}
.item{border:2px solid var(--line);background:var(--paper2);padding:10px 12px}
.item .t{font-family:var(--display);font-size:17px}
.item .d{font-family:var(--ui);font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:2px}
.rec{border-left:3px solid var(--seal);padding:4px 0 4px 12px;margin:6px 0;font-size:15px;line-height:1.75}
.rec small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted)}
.close{float:right;font-family:var(--ui);font-size:13px;background:transparent;border:1.5px solid var(--line);padding:4px 10px}

/* 표지 */
.title{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;padding:calc(13vh + env(safe-area-inset-top,0px)) 16px 16px;background:linear-gradient(180deg,rgba(20,18,14,.55) 0%,rgba(20,18,14,.15) 45%,rgba(20,18,14,.75) 100%),url(art/cover.jpg) center 70%/cover no-repeat,#1b1a17;overflow:auto}
.tcard{text-align:center;color:var(--paper);max-width:760px}
.tcard .eb{font-family:var(--ui);font-size:13px;letter-spacing:.3em;color:#e3c27a}
.tcard h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,10vw,88px);margin:6px 0 4px;line-height:1.1;word-break:keep-all;text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.6);letter-spacing:.04em}
.tcard .sub{font-size:18px;margin:0 0 26px;color:#efe3c6}
.tcard .acts{display:grid;gap:10px;justify-items:center}
.tcard .acts .btn{min-width:240px}
.tcard .credit{font-family:var(--ui);font-size:12.5px;color:#f1e6cc;margin-top:22px;line-height:1.85;display:inline-block;background:rgba(20,16,12,.8);border:1px solid rgba(227,194,122,.35);padding:10px 16px;border-radius:4px}
.tcard .sub{text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 2px #000}
#panel{z-index:70}
.vols{display:grid;gap:8px;margin:10px 0 4px;font-family:var(--ui);font-size:14px}
.vols label{display:grid;grid-template-columns:90px 1fr 48px;align-items:center;gap:10px}
.vols input{width:100%;accent-color:var(--indigo)}
.vols output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.sfxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.sfxgrid button{font-family:var(--ui);font-size:13px;text-align:left;background:var(--paper2);border:2px solid var(--line);padding:6px 10px}
.sfxgrid button:hover{border-color:var(--indigo)}
.dajim{background:#fbf5e4 repeating-linear-gradient(#fbf5e4 0 30px,#efe3c4 30px 31px);border:2px solid var(--ink2);padding:14px 18px;margin:10px 0;font-size:16.5px;line-height:1.9}
.dajim p{margin:4px 0;opacity:.55}.dajim p.cur{opacity:1;background:#fff3d6}
.dajim b{font-weight:700;color:var(--muted)}.dajim b.ok{color:var(--indigo)}.dajim p:has(b.ok){opacity:1}
.seal-s{display:inline-grid;place-items:center;width:22px;height:22px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:11px;transform:rotate(-8deg)}
.dajim .sign{opacity:1;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.sgn{font-style:normal;font-family:var(--display);color:var(--seal);border:2px solid var(--seal);padding:0 6px;margin-left:6px;display:inline-block;transform:rotate(-6deg)}
.tcard .btn:not(.pri){color:var(--text);background:rgba(241,234,216,.95)}
.tcard .credit i{font-style:normal;display:inline-block;border:1.5px solid #e06a5c;color:#e06a5c;font-family:var(--display);padding:0 4px;margin:0 2px;transform:rotate(-6deg)}

/* 논박전 */
.bt{width:min(760px,100%);background:var(--paper);border:3px solid var(--ink2);box-shadow:0 8px 0 rgba(0,0,0,.4);padding:18px 20px;max-height:100%;overflow:auto}
.bt .top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.bt canvas{width:96px;height:96px;image-rendering:pixelated;background:#d9cfb4;border:2px solid var(--ink2)}
.bt .who{font-family:var(--display);font-size:24px}
.bt .gauge{display:flex;gap:4px;margin-top:6px;align-items:center;font-family:var(--ui);font-size:12px;color:var(--muted)}
.bt .pip{width:18px;height:10px;background:var(--seal);border:1.5px solid var(--ink2)}
.bt .pip.off{background:transparent}
.bt .heart{color:var(--seal);font-size:16px;letter-spacing:2px}
.claim{margin-top:14px;background:#fff9ea;border:2px solid var(--line);padding:12px 14px;font-size:17px;line-height:1.8;position:relative}
.claim .lab{font-family:var(--ui);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.claim .orig{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:13px;transform:rotate(-6deg)}
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.ev button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 10px}
.ev button:hover:not(:disabled){border-color:var(--indigo)}
.ev button b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.ev button span{font-family:var(--ui);font-size:12.5px;color:var(--muted);line-height:1.5;display:block}
.ev button.no{border-color:var(--seal);opacity:.6}
.resp{margin-top:12px;padding:10px 14px;font-family:var(--ui);font-size:14.5px;line-height:1.7;background:#e8e2d0;border:2px solid var(--line)}
.resp.win{background:#dfe6ef;border-color:var(--indigo);font-family:var(--body);font-size:16.5px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* 바느질 */
.sew .bar{position:relative;height:44px;background:#efe6cf;border:2px solid var(--ink2);margin:18px 0 10px;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0 18px,rgba(90,70,40,.18) 18px 20px)}
.sew .zone{position:absolute;top:0;bottom:0;background:rgba(179,54,43,.3);border-left:2px solid var(--seal);border-right:2px solid var(--seal)}
.sew .needle{position:absolute;top:-4px;bottom:-4px;width:4px;background:#2a241c;box-shadow:0 0 0 1px #efe6cf}
.sew .st{font-family:var(--display);font-size:26px;letter-spacing:6px;color:var(--seal);text-align:center}

/* 순서 */
.ord ol{margin:10px 0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:e}
.ord li{counter-increment:e;display:grid;grid-template-columns:1.8em 1fr;gap:6px;padding:7px 10px;background:#dfe6ef;border:2px solid var(--indigo);font-size:15.5px;line-height:1.55}
.ord li::before{content:counter(e);font-family:var(--display);color:var(--indigo);font-size:17px}
.ord li.empty{background:transparent;border:2px dashed var(--line);color:var(--muted);font-family:var(--ui);font-size:13px}
.ord .pool{display:grid;gap:6px}
.ord .pool button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 12px;font-size:15.5px;line-height:1.55}
.ord .pool button:hover{border-color:var(--indigo)}

/* 결말 도표 */
.arc svg{width:100%;height:auto;display:block}

/* 터치 */
.pad{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:132px;height:132px;z-index:10;display:none}
.pad button,.act{position:absolute;width:44px;height:44px;background:rgba(241,234,216,.8);border:2px solid var(--ink2);font-family:var(--ui);font-size:16px;touch-action:none}
.pad .u{left:44px;top:0}.pad .d{left:44px;top:88px}.pad .l{left:0;top:44px}.pad .r{left:88px;top:44px}
.act{position:fixed;right:18px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;z-index:10;display:none;font-family:var(--display);font-size:22px}
@media (pointer:coarse){.pad,.act{display:block}}
body.talking .pad,body.talking .act{display:none}
@media (max-width:560px){
  .quest{max-width:100%;font-size:12px}
  .hud{flex-direction:column}
  .hbtns{justify-content:flex-start}
  .dlg .tx{font-size:16px}
  .sheet{padding:18px}
}
@media (prefers-reduced-motion:reduce){.dlg .more,.toast,.shake{animation:none}}

    if(UI.onKey&&UI.onKey(e)){e.preventDefault();return}

  const off=e=>{e.preventDefault();keys[k]=false;keyOrder=keyOrder.filter(x=>x!==k)};

  const p=G.player;if(p.moving||G.lock)return;const [dx,dy]=DIRV[p.dir];const x=p.tx+dx,y=p.ty+dy;
  const n=G.map.npcs.find(n=>visible(n)&&n.tx===x&&n.ty===y);

  const o=G.map.objs.find(o=>o.use&&!(o.hide&&o.hide())&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h);

function entPos(e){const x=e.moving?e.tx+(e.nx-e.tx)*e.prog:e.tx,y=e.moving?e.ty+(e.ny-e.ty)*e.prog:e.ty;return[x*T,y*T]}

  const q=/방향키|노란 느낌표|선택지에서|원작의 인물이/.test(text)?"":quoteOf();
  if(!/방향키|노란 느낌표/.test(text)&&!G.tips.some(x=>x.t===text)){sfx("tip");G.tips.push({route:G.route,ch:G.ch,t:text,q});writeSave();const n=$("#nTip");if(n)n.textContent=G.tips.length;const b=$("#bTip");if(b){b.classList.remove("ping");void b.offsetWidth;b.classList.add("ping")}}
  document.querySelectorAll(".tip").forEach(x=>x.remove());
  const el=document.createElement("div");el.className="tip";el.innerHTML=`<i>배움</i><span>${q?`<em class="tq">${esc(q)}</em>`:""}${esc(text)}</span>`;$("#ui").appendChild(el);
  el.onclick=()=>el.remove();clearTimeout(tipTimer);tipTimer=setTimeout(()=>el.remove(),10000);
}

function timing(level,o){
  o=o||{};
  return new Promise(res=>{
    UI.modal=true;setBodyTalking(true);
    const v=document.createElement("div");v.className="veil";
    v.innerHTML=`<div class="sheet sew"><span class="eb">${esc(o.eb||"삯바느질")}</span><h2>${esc(o.title||"저고리 한 벌")}</h2><p class="note">${esc(o.desc||"바늘이 붉은 칸 안에 들어왔을 때 누르세요.")} (Space · E · 화면 누르기) 세 번 맞추면 끝나요.</p>
      <div class="bar"><div class="zone"></div><div class="needle"></div></div><div class="st">○ ○ ○</div></div>`;
    $("#ui").appendChild(v);
    const bar=v.querySelector(".bar"),zone=v.querySelector(".zone"),nd=v.querySelector(".needle"),st=v.querySelector(".st");
    let hits=0,pos=0,dirn=1,alive=true,zl=0,zw=0;const speed=0.55+level*0.2;
    const newZone=()=>{zw=0.2-level*0.03;zl=0.1+Math.random()*(0.8-zw);zone.style.left=zl*100+"%";zone.style.width=zw*100+"%"};newZone();
    let lt=performance.now();
    const frame=now=>{if(!alive)return;const dt=(now-lt)/1000;lt=now;pos+=dirn*speed*dt;if(pos>1){pos=1;dirn=-1}if(pos<0){pos=0;dirn=1}nd.style.left=`calc(${pos*100}% - 2px)`;requestAnimationFrame(frame)};requestAnimationFrame(frame);
    const press=()=>{if(!alive)return;
      if(pos>=zl&&pos<=zl+zw){hits++;st.textContent="● ".repeat(hits)+"○ ".repeat(3-hits);newZone();
        if(hits>=3){alive=false;setTimeout(()=>{v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res()},350)}}
      else{bar.classList.remove("shake");void bar.offsetWidth;bar.classList.add("shake")}};
    v.addEventListener("pointerdown",e=>{e.preventDefault();press()});
    UI.onKey=e=>{if(["Space","KeyE","Enter","KeyZ"].includes(e.code)){press();return true}return true};
  });
}
function orderPuzzle(title,ev){
  return new Promise(res=>{
    UI.modal=true;setBodyTalking(true);
    const v=document.createElement("div");v.className="veil";$("#ui").appendChild(v);
    const got=[];const seed=ev.length*7+title.length;
    const order=ev.map((e,i)=>i).sort((a,b)=>((a*37+seed)%11)-((b*37+seed)%11));
    if(order.every((x,i)=>x===i))order.push(order.shift());
    const paint=()=>{const done=got.length===ev.length;
      v.innerHTML=`<div class="sheet ord"><span class="eb">줄거리 잇기</span><h2>${esc(title)}</h2><p class="note">이 장에서 일어난 일을 순서대로 눌러 이어 보세요.</p>
      <ol>${got.map(i=>`<li>${esc(ev[i])}</li>`).join("")}${done?"":`<li class="empty">${got.length?"다음 사건은?":"가장 먼저 일어난 일은?"}</li>`}</ol>
      ${done?`<p class="note">줄거리를 복원했어요.</p><div class="row"><button class="btn pri" data-go="1">다음으로 ▶</button></div>`:`<div class="pool">${order.filter(i=>!got.includes(i)).map(i=>`<button data-e="${i}">${esc(ev[i])}</button>`).join("")}</div>`}</div>`};
    paint();
    v.addEventListener("click",e=>{
      const b=e.target.closest("[data-e]");if(b){const i=+b.dataset.e;if(i===got.length){got.push(i);sfx(got.length===ev.length?"correct":"click");paint()}else{sfx("wrong");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}return}
      if(e.target.closest("[data-go]")){v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res()}});
    UI.onKey=e=>{if(got.length===ev.length&&["Enter","Space","KeyE"].includes(e.code)){v.querySelector("[data-go]").click()}return true};
  });
}

function debate(cfg){
  return new Promise(res=>{
    UI.modal=true;setBodyTalking(true);
    const v=document.createElement("div");v.className="veil";$("#ui").appendChild(v);
    let ci=0,hearts=3,state="ask",wrongs=[],msg="",used=null;
    const paint=()=>{const c=cfg.claims[ci];
      v.innerHTML=`<div class="bt"><div class="top"><div class="pc"><img src="art/${PORT[cfg.look]||""}.jpg" alt="" onerror="this.remove()"></div><div><span class="note" style="letter-spacing:.14em">논박전 · 증거로 변명을 꺾어라</span><div class="who">${esc(cfg.name)}</div>
        <div class="gauge">버팀 ${cfg.claims.map((_,i)=>`<span class="pip${i<ci||(i===ci&&state==="won")?" off":""}"></span>`).join("")}<span style="margin-left:14px">비장의 위엄</span> <span class="heart">${"◆".repeat(hearts)}${"◇".repeat(3-hearts)}</span></div></div></div>
        <div class="claim"><div class="lab"><span>${esc(cfg.name)}의 말</span>${c.o?'<span class="orig" title="원문">原</span>':""}</div>${esc(c.t)}${c.o&&G.gloss&&glossOf(c.t)?`<div class="gl"><b>풀이</b>${esc(glossOf(c.t))}</div>`:""}</div>
        ${state==="won"?`${(c.pre||(c.preBy&&c.preBy[used]))?`<div class="resp win"><b>회계 비장</b> “${esc(c.pre||c.preBy[used])}”</div>`:""}<div class="resp win">${c.wo?'<span class="orig" style="display:inline-grid;place-items:center;width:24px;height:24px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:12px;transform:rotate(-6deg);margin-right:6px">原</span>':""}<b>회계 비장</b> “${esc((c.winBy&&c.winBy[used])||c.win)}”${c.wo&&G.gloss&&glossOf(c.win)?`<div class="gl"><b>풀이</b>${esc(glossOf(c.win))}</div>`:""}</div><div class="row"><button class="btn pri" data-next>${ci===cfg.claims.length-1?"논박 끝 ▶":"다음 변명 ▶"}</button></div>`:
        `<p class="note" style="margin-top:12px">이 말을 뒤집을 증거를 고르세요.</p><div class="ev">${G.evid.map(id=>`<button data-ev="${id}" class="${wrongs.includes(id)?"no":""}" ${wrongs.includes(id)?"disabled":""}><b>${esc(EVID[id].t)}</b><span>${esc(EVID[id].d)}</span></button>`).join("")}</div>${msg?`<div class="resp">${msg}</div>`:""}`}
      </div>`};
    paint();
    v.addEventListener("click",e=>{const c=cfg.claims[ci];const b=e.target.closest("[data-ev]");
      if(b&&state==="ask"){const id=b.dataset.ev;
        if(c.ok.includes(id)){used=id;state="won";sfx("stamp");sfx("correct");msg="";if(c.wo)recAdd("bijang",c.win);if(c.o)recAdd(cfg.look,c.t);paint()}
        else{sfx("wrong");wrongs.push(id);hearts--;
          if(hearts<=0){hearts=3;wrongs=[];msg=`사또가 헛기침을 한다. 비장은 정신을 가다듬었다. <b>실마리</b>: ${esc(c.hint)}`}
          else msg=`<b>${esc(cfg.name)}</b> “${esc(c.retort||"그것이 이 일과 무슨 상관이오?")}”<br><b>실마리</b>: ${esc(c.hint)}`;
          paint();v.querySelector(".bt").classList.add("shake")}return}
      if(e.target.closest("[data-next]")){ci++;state="ask";wrongs=[];msg="";if(ci>=cfg.claims.length){v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res()}else paint()}});
    UI.onKey=e=>{if(state==="won"&&["Enter","Space","KeyE"].includes(e.code)){v.querySelector("[data-next]").click()}return true};
  });
}

["회계 비장이 내다보니","회계 비장이 내다보니 춘풍이 죽 쑤는 모습이 우습고도 볼만했다. 이윽고 죽상을 들여오니,"],
["네가 평양 감영 추월의 집에","네가 평양 추월의 집에서 심부름꾼으로 있을 때, 깨진 헌 사발에 누룽지와 국을 부어 숟가락도 없이 마당에 서서 아무렇게나 먹던 일을 생각하며 다 먹어라."],
["하니, 그제야 춘풍이 아내가","그러자 춘풍은 아내가 어디서 죽 먹는 모습을 볼까 봐 여기저기 살피며 허겁지겁 먹었다."],

["이왕에 자넨 줄 알았으나","진작부터 자네인 줄 알았지만, 자네 속마음을 보려고 일부러 그런 것일세."],
["하고, 그날 밤에 부부","그러고는 그날 밤 부부가 원앙이 수놓인 이불을 덮고 누웠으니, 제법 사이좋은 부부로구나."],
["춘풍이 온갖 교태 다할","춘풍이 온갖 거드름을 피우는 모습이 참 볼만하다. 콧잔등을 찡그리고 입맛을 다시며 젓가락으로 이리저리 뒤적이며 하는 말이,"],
["생치 다리도 덜 구워졌고","꿩 다리는 덜 구워졌고, 자반 생선은 기름기가 없고, 쇠고기도 맛이 없네. 평양으로 돌아갈까 보다. 나랏돈만 아니면 올라오지도 않았을 텐데."],
["내일 호조 돈을 다 바치고","내일 나랏돈을 다 갚고 다시 평양에 내려갈 때 자네도 따라가서, 평양에 있는 내 첩(작은집) 집에 가서 음식 맛 좀 보게."],
["온갖 교만 다할 적에","춘풍이 온갖 교만을 부리자, 아내는 남편을 속이려고 해 질 녘을 기다려 여자 옷을 벗고 다시 비장 옷을 입고 느릿느릿 걸어 들어오니,"],
["모화관 활쏘기와","활쏘기, 풍류 놀이, 바둑, 장기, 골패, 쌍륙, 투전 같은 온갖 노름에 기생들까지 달려드니 수천 금이 순식간에 사라졌다. 천하의 부자 석숭이라 한들 무엇이 남겠는가."],
["여보소, 내 말 듣소","여보, 내 말 좀 들어요. 제발 그러지 마오. 술과 여자와 노름을 좋아하지 마오. 예로부터 난봉 부린 사람치고 집안 망하지 않은 사람이 누가 있소?"],
["미나리골 이패두는","미나리골 이패두는 기생을 즐기다가 신세를 망쳤고, 동문 밖 오청두도 노름을 즐기다가 늘그막에 거지가 되었어요. 술 잘 먹고 허황하기로 소문난 모시전 김부자도 수만 금을 다 날리고 기름 장사를 하고 다닌다오."],
["자네 내 말 들어 보소. 사환 대실이","자네 내 말 좀 들어 보게. 심부름꾼 대실이는 술 한 잔 못 마셔도 돈 한 푼 못 모았고, 이각동이는 쉰 살이 되도록 술과 여자를 몰랐어도 남의 집 심부름꾼 신세를 못 면했네. 탑골 복동이는 노름을 몰랐어도 수천 금을 다 날리고 굶어 죽었지."],
["술 잘 먹는 이태백은","술 잘 먹는 이태백은 날마다 취해 있어도 한림학사 벼슬을 다 지냈네. 술과 노름을 좋아하는 건 사내라면 흔한 일일세. 나도 이렇게 놀다가 가장 높은 벼슬을 하고 이름을 후세에 남길 걸세."],
["이때 서울 부상대고","이때 서울의 큰 장사꾼 이춘풍이 수천 냥을 싣고 와서 이웃에 묵는다는 소문을 듣고, 추월은 넌지시 춘풍을 홀리려고 연두저고리 다홍치마로 곱게 차려입고 태연하게 앉아 있었다."],
["얼굴 태도 청천명월","얼굴은 맑은 하늘의 밝은 달 같고, 아침 이슬에 반쯤 핀 모란꽃 같다. 그 맵시는 그늘 속 해당화를 그린 그림 같고, 달나라 선녀 항아 같구나."],
["제가 본디 계집이라 하면","춘풍은 본래 여자라면 화약을 짊어지고 불구덩이에라도 뛰어들 사람이라, 온 정신이 추월에게 쏠렸다."],
["허랑한 이춘풍이 장사에","허황한 이춘풍은 장사에는 뜻이 없고, 그날부터 이천오백 냥을 제멋대로 쓰기 시작했다."],

["이리저리 생각하다가 추월","이리저리 궁리하다가 추월 앞에 나가 앉아 간절히 빌며 하는 말이,"],

["주야로 한량들은","밤낮으로 놀이꾼들이 푸른 산에 구름 모이듯, 절 행사에 스님 모이듯, 개성 장터에 장사꾼 모이듯 추월의 집으로 모여들어, 온갖 장난을 치며 좋은 술과 안주로 술잔과 접시가 어지럽게 흩어졌다."],

["울고 가는 저 기러기야","울며 날아가는 저 기러기야, 내 사정을 듣고 고향에 전해 다오. 아내가 그립구나. 나를 그리워하다 죽었는지 살았는지, 생각할수록 사내 대장부의 애간장이 봄눈 녹듯 녹는구나."],
["매화야 옛 등걸에","늙은 매화나무에도 봄이 돌아오는구나. 꽃이 필 법도 하다마는 흰 눈이 어지러이 날리니 필지 말지. 아, 세상일 우습구나. (다시 일어설 수 있을지 모르는 처지를 빗댄 노래)"],

["간사한 추월이는 회계 비장","간사한 추월은 회계 비장을 홀리려고 교태를 부리며 특별히 진수성찬을 차려 올렸다."],

function glossOf(t){
  let best=null,len=0;
  for(const [k,v] of GLOSS){if(t.startsWith(k)&&k.length>len){best=v;len=k.length}}
  return best;
}

const ARR={ArrowUp:"u",KeyW:"u",ArrowDown:"d",KeyS:"d",ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r"};
const ARG={u:"↑",d:"↓",l:"←",r:"→"};
function mgOpen(html){UI.modal=true;setBodyTalking(true);const v=document.createElement("div");v.className="veil";v.innerHTML=`<div class="sheet mg">${html}</div>`;$("#ui").appendChild(v);return v}
function mgClose(v){v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false)}
function shk(el){if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
const PAD4=`<div class="pad4"><button data-a="u">↑</button><button data-a="l">←</button><button data-a="d">↓</button><button data-a="r">→</button></div>`;

/* 땀 뜨기: 화살표 순서대로 누르기 */
function stitchGame(len,title,col){
  return new Promise(res=>{
    const seq=Array.from({length:len},()=>"udlr"[Math.floor(Math.random()*4)]);let i=0,combo=0;
    const X=k=>6+k*(88/len),SW=88/len;
    const v=mgOpen(`<span class="eb">삯바느질 · 땀 뜨기</span><h2>${esc(title)}</h2><p class="note">화살표가 가리키는 방향키(또는 아래 버튼)를 순서대로 눌러 한 땀씩 꿰매요. 틀리면 실이 엉켜 한 땀 풀려요.</p>
      <div class="cloth2" style="--cl:${col||"#efe3c8"}"><div class="weave"></div><div class="seam2"></div><div class="stitches"></div><div class="thr"></div><div class="needle"><i></i></div><div class="spark"></div></div>
      <div class="sewbar"><span class="combo"></span><span class="cnt"></span></div><div class="seq"></div>${PAD4}`);
    const cl=v.querySelector(".cloth2"),st=v.querySelector(".stitches"),nd=v.querySelector(".needle"),th=v.querySelector(".thr");
    const place=()=>{const x=X(i);nd.style.left=x+"%";th.style.left=(i?X(i-1)+SW*0.6:X(0))+"%";th.style.width=Math.max(0,x-(i?X(i-1)+SW*0.6:X(0)))+"%"};
    const paint=()=>{v.querySelector(".seq").innerHTML=seq.map((a,k)=>`<span class="arr${k<i?" ok":k===i?" cur":""}">${ARG[a]}</span>`).join("");
      v.querySelector(".cnt").textContent=`${i} / ${len} 땀`;v.querySelector(".combo").textContent=combo>=3?`손놀림이 척척! ×${combo}`:"";place()};
    const hit=a=>{
      if(i>=len)return;
      if(a===seq[i]){
        const s=document.createElement("span");s.className="st";s.style.left=X(i)+"%";s.style.width=SW*0.6+"%";st.appendChild(s);
        nd.classList.remove("dip");void nd.offsetWidth;nd.classList.add("dip");
        const sp=v.querySelector(".spark");sp.style.left=X(i)+SW*0.3+"%";sp.classList.remove("on");void sp.offsetWidth;sp.classList.add("on");
        i++;combo++;paint();sfx("stitch");
        if(i>=len){sfx("correct");nd.classList.add("done");cl.classList.add("finish");setTimeout(()=>{mgClose(v);res()},800)}
      }else{
        sfx("wrong");combo=0;cl.classList.remove("tangle");void cl.offsetWidth;cl.classList.add("tangle");
        if(i>0){const last=st.lastElementChild;if(last){last.classList.add("out");setTimeout(()=>last.remove(),250)}i--}
        paint();
      }};
    paint();v.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)hit(b.dataset.a)});
    UI.onKey=e=>{const a=ARR[e.code];if(a){hit(a);return true}return true};
  });
}

      <div class="wellbox"><div class="rope"></div><div class="bucket">🪣</div></div><div class="gauge"><i></i></div><div class="pad2"><button data-a="l">← 왼손</button><button data-a="r">오른손 →</button></div>`);

        const down=e=>{e.preventDefault();t0=performance.now();sfx("stitch");clearTimeout(raf);raf=setTimeout(step,16)};

const SFXVOL={blip:20,click:18,step:40,page:10,tip:7.5,stitch:14,bubble:13,pull:24,coin:4.6,gain:5,correct:5.5,wrong:15,whack:3.2,gong:1.9,poof:9,splash:5.5,stamp:5.5};
/* ═════════ 효과음 (직접 합성) ═════════ */
function sfx(name){
  if(!AU.sfxOn)return;if(!AU.ctx&&!auInit())return;const ac=AU.ctx;if(ac.state==="suspended")ac.resume();
  const t=ac.currentTime+0.01;
  if(!AU.sfxBus){const c=ac.createDynamicsCompressor();c.threshold.value=-8;c.knee.value=6;c.ratio.value=10;c.attack.value=0.002;c.release.value=0.12;c.connect(ac.destination);AU.sfxBus=c}
  const out=ac.createGain();out.gain.value=(SFXVOL[name]||3)*AU.sfxVol;out.connect(AU.sfxBus);
  if(AU.bus&&!/step|blip/.test(name)){AU.bus.gain.cancelScheduledValues(t);AU.bus.gain.setTargetAtTime(0.45,t,0.02);AU.bus.gain.setTargetAtTime(1,t+0.35,0.25)}
  const tone=(f,st,dur,type,vol,f2)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t+st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+st+dur);
    g.gain.setValueAtTime(0.0001,t+st);g.gain.exponentialRampToValueAtTime(vol,t+st+0.005);g.gain.exponentialRampToValueAtTime(0.0005,t+st+dur);o.connect(g);g.connect(out);o.start(t+st);o.stop(t+st+dur+0.05)};
  const noise=(st,dur,type,freq,vol,q,freq2)=>{const n=noiseSrc(t+st,dur),f=ac.createBiquadFilter(),g=ac.createGain();f.type=type;f.frequency.setValueAtTime(freq,t+st);if(freq2)f.frequency.exponentialRampToValueAtTime(freq2,t+st+dur);f.Q.value=q||1;
    g.gain.setValueAtTime(0.0001,t+st);g.gain.exponentialRampToValueAtTime(vol,t+st+0.004);g.gain.exponentialRampToValueAtTime(0.0005,t+st+dur);n.connect(f);f.connect(g);g.connect(out)};
  switch(name){
    case"blip":tone(740,0,0.05,"triangle",0.05);break;
    case"click":tone(1200,0,0.04,"square",0.035);tone(1800,0.01,0.03,"sine",0.03);break;
    case"step":noise(0,0.06,"lowpass",420,0.05);break;
    case"page":noise(0,0.16,"bandpass",2400,0.06,0.7,900);break;
    case"coin":tone(1318,0,0.18,"sine",0.12);tone(1760,0.07,0.28,"sine",0.1);tone(2637,0.07,0.12,"triangle",0.03);break;
    case"gain":[0,0.09,0.18].forEach((s,i)=>tone([784,988,1175][i],s,0.35,"triangle",0.1));break;
    case"tip":tone(988,0,0.25,"sine",0.06);tone(1318,0.08,0.3,"sine",0.05);break;
    case"correct":tone(659,0,0.18,"triangle",0.11);tone(988,0.1,0.35,"triangle",0.11);break;
    case"wrong":tone(180,0,0.22,"square",0.06,120);noise(0,0.12,"lowpass",600,0.05);break;
    case"whack":noise(0,0.09,"bandpass",1500,0.5,0.9);tone(140,0,0.22,"sine",0.45,55);noise(0.01,0.05,"highpass",3500,0.18);break;
    case"gong":[110,166,221,277].forEach((f,i)=>tone(f,0,2.6-i*0.3,"sine",[0.22,0.12,0.08,0.05][i],f*0.985));noise(0,0.08,"bandpass",900,0.08);break;
    case"poof":noise(0,0.45,"bandpass",300,0.16,0.8,4200);tone(523,0.25,0.3,"triangle",0.06);tone(784,0.33,0.3,"triangle",0.05);break;
    case"splash":noise(0,0.5,"lowpass",3000,0.2,0.7,400);noise(0.08,0.3,"bandpass",1200,0.08);break;
    case"bubble":tone(300+Math.random()*200,0,0.07,"sine",0.07,700+Math.random()*300);break;
    case"stitch":tone(2400,0,0.03,"square",0.03);noise(0,0.04,"highpass",5000,0.05);break;
    case"pull":noise(0,0.1,"bandpass",700,0.07,1.5);tone(200,0,0.08,"triangle",0.04,260);break;
    case"stamp":tone(90,0,0.2,"sine",0.3,50);noise(0,0.06,"lowpass",800,0.2);break;
  }
}

const FX=[];
async function flog(target,n,opt){
  opt=opt||{};
  const hit=G.map.npcs.find(x=>(x.look==="sar"||x.look==="guard")&&x!==target&&visible(x));let back=null;
  if(hit){back=[hit.tx,hit.ty,hit.dir];G.flash=0;setNear(hit,[[target.tx-1,target.ty],[target.tx+1,target.ty],[target.tx-1,target.ty+1],[target.tx+1,target.ty+1]]);hit.dir=hit.tx<target.tx?"r":"l";hit.fixed=1;await sleep(250)}
  for(let i=0;i<n;i++){
    const t0=performance.now()/1000;FX.push({k:"paddle",e:target,t0,dur:0.42,count:(opt.from||0)+i+1});
    await sleep(210);sfx("whack");G.shake=Math.max(G.shake||0,opt.hard?5:3.5);target.hurt=0.35;
    FX.push({k:"hit",e:target,t0:performance.now()/1000,dur:0.5,count:(opt.from||0)+i+1});
    await sleep(opt.fast?260:380);
  }
  if(hit&&back){await sleep(200);hit.tx=back[0];hit.ty=back[1];hit.dir=back[2]}
}
function drawFX(t){
  const cx=G.cam.x,cy=G.cam.y;
  for(let i=FX.length-1;i>=0;i--){const f=FX[i],p=(t-f.t0)/f.dur;if(p>1.2){FX.splice(i,1);continue}if(p<0)continue;
    const [px,py]=entPos(f.e),sx=Math.round(px-cx),sy=Math.round(py-cy);
    if(f.k==="paddle"){const a=-1.7+Math.min(1,p*1.9)*2.3;ctx.save();ctx.translate(sx+26,sy-30);ctx.rotate(a);
      ctx.fillStyle="#1d1813";ctx.fillRect(-4,-1,8,40);ctx.fillStyle="#6d4b2c";ctx.fillRect(-2,0,4,14);ctx.fillStyle="#a07a4c";ctx.fillRect(-3,14,6,24);ctx.fillStyle="#c49a64";ctx.fillRect(-2,15,1,22);ctx.restore()}
    if(f.k==="hit"&&p<1){const r=4+p*10,al=1-p;ctx.globalAlpha=al;ctx.fillStyle="#fff6c8";
      for(let k=0;k<8;k++){const an=k*Math.PI/4+0.3;ctx.fillRect(Math.round(sx+8+Math.cos(an)*r)-1,Math.round(sy-2+Math.sin(an)*r)-1,2,2)}
      ctx.fillStyle="#e0493a";ctx.fillRect(sx+6,sy-4,4,4);ctx.globalAlpha=1}
  }
}

        <button class="route" data-r="wife"><img src="art/p_wife.jpg" alt="" onerror="this.remove()"><b>춘풍의 아내</b><span>방탕한 남편을 구하러 계교를 꾸미고, 남장을 하고 평양으로 간다. 증거를 모아 논박전으로 추월을 꺾는다.</span></button>
        <button class="route" data-r="chun"><img src="art/p_chun.jpg" alt="" onerror="this.remove()"><b>이춘풍</b><span>나랏돈 이천 냥을 들고 평양으로 간 한량. 기생 추월에게 모든 것을 잃고 사환이 된다. 그리고 수상한 비장을 만난다.</span></button>
      </div><div class="acts" style="margin-top:14px"><button class="btn" data-t="back">뒤로</button></div></div>`
    :`<div class="tcard"><div class="eb">이춘풍전 서사 RPG</div><h1>비장이 된 아내</h1><p class="sub">방탕한 남편을 구하러, 아내는 남장을 하고 평양으로 간다</p>
    <div class="acts">${sv&&sv.ch?`<button class="btn pri" data-t="resume">이어 하기 · ${esc((ROUTES[sv.route]||ROUTES.wife).name)} 제${sv.ch}장</button><button class="btn" data-t="new">새로 시작</button>`:`<button class="btn pri" data-t="new">이야기 시작</button>`}<button class="btn" data-t="menu">장 고르기 · 조작법</button></div>
    <div class="credit">작자 미상 판소리계 소설 「이춘풍전」을 바탕으로 새로 꾸민 이야기예요<br>실제 원문은 붉은 낙관 <i>原</i>으로 표시해요 · 그림은 AI로 생성했고, 배경음은 게임 안에서 직접 합성해요<br>만든이 경포고등학교 한예지<br><button class="lnk" data-t="credits">만든 곳·출처 보기</button></div></div>`;
    const f=el.querySelector(".btn.pri,.route");f&&f.focus();
  };
  paint(false);
  document.body.appendChild(el);
  UI.modal=true;UI.onKey=null;
  el.addEventListener("click",e=>{
    const r=e.target.closest("[data-r]");if(r){el.remove();UI.modal=false;G.rec=[];G.evid=[];startChapter(r.dataset.r,1);return}
    const b=e.target.closest("[data-t]");if(!b)return;const v=b.dataset.t;
    if(v==="menu"){$("#bMenu").click();return}
    if(v==="credits"){showCredits();return}
    if(v==="new"){paint(true);return}
    if(v==="back"){paint(false);return}
    if(v==="resume"){el.remove();UI.modal=false;G.rec=sv.rec||[];startChapter(sv.route||"wife",sv.ch)}
  });
}
(()=>{let j=null;try{j=JSON.parse(sessionStorage.getItem("bj-jump")||"null");sessionStorage.removeItem("bj-jump")}catch(err){}
  if(j&&j.route){const sv=loadSave()||{};G.rec=(sv.route===j.route?sv.rec:[])||[];G.evid=[];startChapter(j.route,j.ch)}else showTitle()})();

</script>
